<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MySrijan" />
  <title>MySrijan • AI Creative Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --whatsapp: #16a34a;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 35px -10px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* ================= LOGIN SCREEN ================= */
    .login-wrapper {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #fff7ed 0%, #f8fafc 60%);
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeUp 0.35s ease;
    }

    .brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--primary);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 10px 20px -5px rgba(15, 23, 42, 0.25);
    }

    .login-card h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .login-card p {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
      max-width: 290px;
    }

    .login-status {
      font-size: 12px;
      font-weight: 600;
      color: #dc2626;
      min-height: 18px;
    }

    /* ================= STICKY APP HEADER ================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .icon-btn:active { transform: scale(0.95); background: var(--surface-muted); }

    .header-title-group {
      display: flex;
      flex-direction: column;
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.2;
    }

    /* Profile Avatar Trigger */
    .avatar-trigger {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }
    .avatar-trigger:hover { border-color: var(--accent); }
    .avatar-trigger:active { transform: scale(0.95); }
    .avatar-trigger img { width: 100%; height: 100%; object-fit: cover; }

    /* ================= PROFILE POPOVER (PROPERLY ANCHORED BELOW HEADER) ================= */
    .menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(15, 23, 42, 0.18);
    }

    .profile-popover {
      position: fixed;
      top: 66px;
      right: max(16px, calc(50vw - 214px));
      width: 268px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-lg);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .user-meta-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .user-meta-email { font-size: 12px; color: var(--text-secondary); word-break: break-all; }

    .usage-card {
      background: var(--surface-muted);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .usage-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .usage-count { color: var(--text-main); font-weight: 800; }

    .usage-track {
      width: 100%;
      height: 7px;
      background: #cbd5e1;
      border-radius: 99px;
      overflow: hidden;
    }
    .usage-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .logout-btn {
      width: 100%;
      height: 38px;
      border-radius: 10px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #dc2626;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease;
    }
    .logout-btn:hover { background: #fee2e2; }

    /* ================= LEFT MODEL DRAWER ================= */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      z-index: 60;
    }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      max-width: 82vw;
      background: var(--surface);
      z-index: 70;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 16px 0 40px rgba(15, 23, 42, 0.15);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar-drawer.closed { transform: translateX(-105%); }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-title { font-size: 15px; font-weight: 800; color: var(--text-main); }

    .model-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .model-card {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .model-card:hover { border-color: #cbd5e1; background: var(--surface-muted); }
    .model-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .model-tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 3px;
    }
    .model-title {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* ================= MAIN WORKSPACE ================= */
    .workspace {
      width: 100%;
      max-width: 460px;
      padding: 14px 16px 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Segmented Day Switcher */
    .day-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-muted);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .day-tab {
      border: none;
      background: transparent;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.18s ease;
    }
    .day-tab.active {
      background: var(--surface);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    /* Poster Frame */
    .canvas-card {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 20px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }
    canvas { width: 100%; height: 100%; display: block; }

    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fb923c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Primary AI Generate Button */
    .generate-btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .generate-btn:hover { background: var(--primary-hover); }
    .generate-btn:active { transform: scale(0.985); }

    /* Clean Caption Card (No Scrollbar) */
    .caption-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .caption-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .saved-pill {
      color: var(--whatsapp);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .saved-pill.visible { opacity: 1; }

    .caption-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--text-main);
      font-family: inherit;
      resize: none;
      overflow: hidden;
      outline: none;
      min-height: 44px;
    }

    /* Bottom Action Row */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1.65fr;
      gap: 10px;
    }
    .btn-action {
      height: 50px;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .btn-action:active { transform: scale(0.97); }
    .btn-secondary {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-whatsapp {
      background: var(--whatsapp);
      color: #ffffff;
      border: none;
      box-shadow: 0 8px 18px -4px rgba(22, 163, 74, 0.35);
    }

    .status-note {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      min-height: 18px;
    }
  </style>
</head>
<body>

  <!-- 1. Google Sign-In Screen -->
  <div class="login-wrapper" id="loginScreen">
    <div class="login-card">
      <div class="brand-mark">सृ</div>
      <h1>MySrijan</h1>
      <p>अपने व्यक्तिगत AI क्रिएटिव स्टूडियो में प्रवेश करने के लिए अपने Gmail खाते से लॉगिन करें।</p>
      <div id="googleBtnContainer" style="margin-top: 4px;"></div>
      <div class="login-status" id="loginError"></div>
    </div>
  </div>

  <!-- 2. Authenticated Studio Shell -->
  <div id="appShell" class="hidden" style="width: 100%;">
    <!-- Sticky Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <button type="button" class="icon-btn" onclick="toggleSidebar(true)" aria-label="Models">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
            </svg>
          </button>
          <div class="header-title-group">
            <span class="header-title">MySrijan</span>
            <span class="header-subtitle" id="activeModelTitle">सुप्रभात संदेश</span>
          </div>
        </div>

        <button type="button" class="avatar-trigger" id="avatarBtn" onclick="toggleProfileMenu()" aria-label="Account">U</button>
      </div>
    </header>

    <!-- Profile Dropdown Overlay -->
    <div class="menu-backdrop hidden" id="menuBackdrop" onclick="closeProfileMenu()"></div>
    <div class="profile-popover hidden" id="profilePopover">
      <div class="user-meta">
        <span class="user-meta-name" id="pmName">User</span>
        <span class="user-meta-email" id="pmEmail">user@gmail.com</span>
      </div>
      <div class="usage-card">
        <div class="usage-top">
          <span>Credit Usage</span>
          <span class="usage-count" id="pmUsageCount">0 / 3</span>
        </div>
        <div class="usage-track">
          <div class="usage-fill" id="pmUsageFill"></div>
        </div>
      </div>
      <button type="button" class="logout-btn" onclick="handleLogout()">Log out</button>
    </div>

    <!-- Left Model Drawer -->
    <div class="drawer-overlay hidden" id="drawerOverlay" onclick="toggleSidebar(false)"></div>
    <aside class="sidebar-drawer closed" id="sidebarDrawer">
      <div class="drawer-header">
        <span class="drawer-title">आपके मॉडल्स</span>
        <button type="button" class="icon-btn" style="width:32px;height:32px;" onclick="toggleSidebar(false)">✕</button>
      </div>
      <div class="model-list" id="sidebarModelList"></div>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace" style="margin: 0 auto;">
      <div class="day-switcher">
        <button type="button" class="day-tab active" id="tabToday" onclick="switchDay(0)">आज का पोस्टर</button>
        <button type="button" class="day-tab" id="tabTomorrow" onclick="switchDay(1)">कल का पोस्टर</button>
      </div>

      <section class="canvas-card">
        <canvas id="posterCanvas" width="1080" height="1350"></canvas>
        <div class="loader-overlay hidden" id="loader">
          <div class="spinner"></div>
          <div style="font-size: 15px; font-weight: 700;">नई इमेज तैयार हो रही है...</div>
          <div style="font-size: 12px; color: #cbd5e1; margin-top: 4px;">यह अगले 24 घंटे तक सुरक्षित रहेगी</div>
        </div>
      </section>

      <button type="button" class="generate-btn" onclick="generateNewAIImage()">
        <span>✨ नई इमेज जनरेट करें</span>
      </button>

      <section class="caption-card">
        <div class="caption-header">
          <span>साथ भेजने वाला संदेश</span>
          <span class="saved-pill" id="savedPill">✓ सेव हो गया</span>
        </div>
        <textarea
          id="captionInput"
          class="caption-input"
          rows="2"
          placeholder="यहाँ अपना संदेश लिखें..."
          oninput="handleCaptionInput(this)"
        ></textarea>
      </section>

      <div class="action-grid">
        <button type="button" class="btn-action btn-secondary" onclick="downloadPoster()">⬇️ Save HD</button>
        <button type="button" class="btn-action btn-whatsapp" onclick="shareWhatsApp()">📲 WhatsApp पर भेजें</button>
      </div>

      <div class="status-note" id="statusNote"></div>
    </main>
  </div>

  <script>
    // Connected Google Apps Script Backend URL
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbx6zoZnGG48_mdAcC-AEw3RFaEZYApaXxwChFd6t1_vYJbSYLFvrh5MbTZliPvRF_5Y/exec";

    var idToken = localStorage.getItem("mysrijan_id_token") || "";
    var userSession = null;
    var activeModel = null;
    var dayOffset = 0;
    var currentBgDataUrl = null;
    var saveTimer = null;

    var DAYS_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var MONTHS_EN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    // 1. Dynamic PWA Manifest ("MySrijan")
    (function setupManifest() {
      var manifest = {
        name: "MySrijan",
        short_name: "MySrijan",
        start_url: ".",
        display: "standalone",
        background_color: "#f8fafc",
        theme_color: "#0f172a",
        icons: [{
          src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230f172a'/><text x='50' y='65' font-size='48' fill='%23ffffff' font-family='sans-serif' font-weight='bold' text-anchor='middle'>सृ</text></svg>",
          sizes: "512x512",
          type: "image/svg+xml"
        }]
      };
      var link = document.createElement("link");
      link.rel = "manifest";
      link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    })();

    // 2. IndexedDB for 24-Hour Image Persistence
    function openPosterDB() {
      return new Promise(function (resolve, reject) {
        var req = indexedDB.open("MySrijanDB", 1);
        req.onupgradeneeded = function (e) {
          e.target.result.createObjectStore("posters", { keyPath: "key" });
        };
        req.onsuccess = function (e) { resolve(e.target.result); };
        req.onerror = function (e) { reject(e); };
      });
    }

    async function savePoster24h(key, dataUrl) {
      try {
        var db = await openPosterDB();
        var tx = db.transaction("posters", "readwrite");
        tx.objectStore("posters").put({ key: key, dataUrl: dataUrl, savedAt: Date.now() });
      } catch (e) {}
    }

    async function getPoster24h(key) {
      try {
        var db = await openPosterDB();
        return await new Promise(function (resolve) {
          var tx = db.transaction("posters", "readonly");
          var req = tx.objectStore("posters").get(key);
          req.onsuccess = function () {
            var item = req.result;
            if (item && (Date.now() - item.savedAt) < 86400000) {
              resolve(item.dataUrl);
            } else {
              resolve(null);
            }
          };
          req.onerror = function () { resolve(null); };
        });
      } catch (e) {
        return null;
      }
    }

    // 3. Google Sign-In Initialization
    window.onload = async function () {
      try {
        var cfgRes = await fetch(GAS_API_URL + "?action=public_config");
        var cfg = await cfgRes.json();
        if (cfg.googleClientId && cfg.googleClientId !== "PASTE_YOUR_GOOGLE_OAUTH_CLIENT_ID_HERE" && window.google) {
          google.accounts.id.initialize({
            client_id: cfg.googleClientId,
            callback: onGoogleSignIn
          });
          google.accounts.id.renderButton(document.getElementById("googleBtnContainer"), {
            theme: "outline",
            size: "large",
            shape: "pill",
            text: "signin_with"
          });
        } else {
          document.getElementById("loginError").textContent = "कृपया Google Sheet की Config टैब में GOOGLE_CLIENT_ID सेट करें।";
        }
      } catch (e) {
        document.getElementById("loginError").textContent = "सर्वर से जुड़ने में समस्या आ रही है।";
      }

      if (idToken) {
        authenticateSession(idToken);
      }
    };

    function onGoogleSignIn(response) {
      idToken = response.credential;
      localStorage.setItem("mysrijan_id_token", idToken);
      authenticateSession(idToken);
    }

    async function authenticateSession(token) {
      document.getElementById("loginError").textContent = "खाता सत्यापित हो रहा है...";
      try {
        var res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "login", idToken: token })
        });
        var data = await res.json();
        if (!data.ok) {
          localStorage.removeItem("mysrijan_id_token");
          document.getElementById("loginError").textContent = data.error || "लॉगिन विफल रहा।";
          return;
        }

        userSession = data;
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("appShell").classList.remove("hidden");

        setupProfileUI();
        renderModelList();
        selectModel(data.models[0]);
      } catch (err) {
        document.getElementById("loginError").textContent = "कनेक्शन त्रुटि: " + err.message;
      }
    }

    function setupProfileUI() {
      var u = userSession.user;
      document.getElementById("pmName").textContent = u.name;
      document.getElementById("pmEmail").textContent = u.email;

      var avatarBtn = document.getElementById("avatarBtn");
      if (u.picture) {
        avatarBtn.innerHTML = '<img src="' + u.picture + '" alt="Profile" />';
      } else {
        avatarBtn.textContent = u.name.charAt(0).toUpperCase();
      }
      updateUsageMeter(u.usedToday, u.dailyLimit);
    }

    function updateUsageMeter(used, limit) {
      document.getElementById("pmUsageCount").textContent = used + " / " + limit;
      var pct = Math.min(100, Math.round((used / Math.max(1, limit)) * 100));
      document.getElementById("pmUsageFill").style.width = pct + "%";
    }

    function toggleProfileMenu() {
      var pop = document.getElementById("profilePopover");
      var back = document.getElementById("menuBackdrop");
      var isClosed = pop.classList.contains("hidden");
      if (isClosed) {
        pop.classList.remove("hidden");
        back.classList.remove("hidden");
      } else {
        closeProfileMenu();
      }
    }

    function closeProfileMenu() {
      document.getElementById("profilePopover").classList.add("hidden");
      document.getElementById("menuBackdrop").classList.add("hidden");
    }

    function toggleSidebar(open) {
      closeProfileMenu();
      var drawer = document.getElementById("sidebarDrawer");
      var overlay = document.getElementById("drawerOverlay");
      if (open) {
        drawer.classList.remove("closed");
        overlay.classList.remove("hidden");
      } else {
        drawer.classList.add("closed");
        overlay.classList.add("hidden");
      }
    }

    function handleLogout() {
      localStorage.removeItem("mysrijan_id_token");
      location.reload();
    }

    function renderModelList() {
      var listEl = document.getElementById("sidebarModelList");
      listEl.innerHTML = "";
      userSession.models.forEach(function (m) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "model-card" + (activeModel && activeModel.id === m.id ? " active" : "");
        btn.innerHTML = '<span class="model-tag">' + m.badge + '</span><span class="model-title">' + m.name + '</span>';
        btn.onclick = function () {
          selectModel(m);
          toggleSidebar(false);
        };
        listEl.appendChild(btn);
      });
    }

    async function selectModel(model) {
      activeModel = model;
      document.getElementById("activeModelTitle").textContent = model.name;
      renderModelList();

      var msgKey = "mysrijan_msg_" + userSession.user.email + "_" + model.id;
      var savedMsg = localStorage.getItem(msgKey);
      var ta = document.getElementById("captionInput");
      ta.value = savedMsg !== null ? savedMsg : model.defaultMessage;
      autoGrow(ta);

      var posterKey = "mysrijan_img_" + userSession.user.email + "_" + model.id;
      currentBgDataUrl = await getPoster24h(posterKey);
      renderCanvas();
      setNote(currentBgDataUrl ? "24-घंटे की सेव इमेज लोड हुई" : "डिफ़ॉल्ट दृश्य तैयार है");
    }

    function autoGrow(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    function handleCaptionInput(el) {
      autoGrow(el);
      if (userSession && activeModel) {
        var msgKey = "mysrijan_msg_" + userSession.user.email + "_" + activeModel.id;
        localStorage.setItem(msgKey, el.value);
      }
      var pill = document.getElementById("savedPill");
      pill.classList.add("visible");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { pill.classList.remove("visible"); }, 1400);
    }

    function switchDay(offset) {
      dayOffset = offset;
      document.getElementById("tabToday").classList.toggle("active", offset === 0);
      document.getElementById("tabTomorrow").classList.toggle("active", offset === 1);
      renderCanvas();
    }

    function getTargetDate(offset) {
      var d = new Date();
      d.setDate(d.getDate() + offset);
      var dd = String(d.getDate()).padStart(2, "0");
      var mm = String(d.getMonth() + 1).padStart(2, "0");
      var yyyy = d.getFullYear();
      return {
        isoKey: yyyy + "-" + mm + "-" + dd,
        formattedDate: d.getDate() + " " + MONTHS_EN[d.getMonth()] + " " + yyyy,
        dayName: DAYS_EN[d.getDay()]
      };
    }

    async function generateNewAIImage() {
      if (!userSession || !activeModel) return;
      if (userSession.user.usedToday >= userSession.user.dailyLimit) {
        setNote("⚠️ आज की क्रेडिट सीमा (" + userSession.user.dailyLimit + "/" + userSession.user.dailyLimit + ") पूरी हो गई है।");
        return;
      }

      var dateInfo = getTargetDate(dayOffset);
      var quoteText = document.getElementById("captionInput").value.trim() || activeModel.defaultMessage;
      var loader = document.getElementById("loader");
      loader.classList.remove("hidden");

      try {
        var res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "generate",
            idToken: idToken,
            basePrompt: activeModel.prompt,
            modelName: activeModel.name,
            dateStr: dateInfo.formattedDate,
            dayStr: dateInfo.dayName,
            quote: quoteText
          })
        });
        var data = await res.json();
        loader.classList.add("hidden");

        if (!data.ok) {
          setNote("⚠️ " + (data.error || "इमेज जनरेट नहीं हो सकी।"));
          return;
        }

        currentBgDataUrl = data.dataUrl;
        userSession.user.usedToday = data.usedToday;
        userSession.user.remainingCredits = data.remainingCredits;
        updateUsageMeter(data.usedToday, data.dailyLimit);

        var posterKey = "mysrijan_img_" + userSession.user.email + "_" + activeModel.id;
        await savePoster24h(posterKey, currentBgDataUrl);

        renderCanvas();
        setNote("✨ नई इमेज तैयार और अगले 24 घंटे के लिए सेव हो गई");
      } catch (err) {
        loader.classList.add("hidden");
        setNote("⚠️ नेटवर्क त्रुटि: " + err.message);
      }
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawDefaultBackdrop(ctx, W, H) {
      var sky = ctx.createLinearGradient(0, 0, 0, H * 0.65);
      sky.addColorStop(0, "#0f172a");
      sky.addColorStop(0.45, "#9a3412");
      sky.addColorStop(0.8, "#f59e0b");
      sky.addColorStop(1, "#fef08a");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      var glow = ctx.createRadialGradient(W * 0.5, H * 0.44, 20, W * 0.5, H * 0.44, 340);
      glow.addColorStop(0, "rgba(255, 251, 235, 0.95)");
      glow.addColorStop(1, "rgba(251, 146, 60, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      var hills = ctx.createLinearGradient(0, H * 0.52, 0, H);
      hills.addColorStop(0, "#3f6212");
      hills.addColorStop(1, "#052e16");
      ctx.fillStyle = hills;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.56);
      ctx.quadraticCurveTo(W * 0.5, H * 0.49, W, H * 0.56);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.fill();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      var words = String(text).split(" ");
      var line = "";
      var lines = [];
      for (var n = 0; n < words.length; n++) {
        var testLine = line + words[n] + " ";
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line.trim());
          line = words[n] + " ";
        } else {
          line = testLine;
        }
      }
      lines.push(line.trim());
      var startY = y - ((lines.length - 1) * lineHeight) / 2;
      for (var i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, startY + i * lineHeight);
      }
    }

    function renderCanvas() {
      if (!activeModel || !userSession) return;
      var canvas = document.getElementById("posterCanvas");
      var ctx = canvas.getContext("2d");
      var W = canvas.width;
      var H = canvas.height;
      var dateInfo = getTargetDate(dayOffset);
      var quoteText = document.getElementById("captionInput").value.trim() || activeModel.defaultMessage;

      var drawOverlays = function () {
        var topGrad = ctx.createLinearGradient(0, 0, 0, 320);
        topGrad.addColorStop(0, "rgba(15, 23, 42, 0.7)");
        topGrad.addColorStop(1, "rgba(15, 23, 42, 0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, W, 320);

        var botGrad = ctx.createLinearGradient(0, H - 560, 0, H);
        botGrad.addColorStop(0, "rgba(15, 23, 42, 0)");
        botGrad.addColorStop(1, "rgba(15, 23, 42, 0.92)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, H - 560, W, 560);

        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(15, 23, 42, 0.5)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
        ctx.lineWidth = 2;
        drawRoundRect(ctx, W / 2 - 275, 46, 550, 56, 28);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "600 28px 'Inter', sans-serif";
        ctx.fillText(dateInfo.formattedDate + "  •  " + dateInfo.dayName, W / 2, 84);

        var goldGrad = ctx.createLinearGradient(0, 130, 0, 245);
        goldGrad.addColorStop(0, "#fef08a");
        goldGrad.addColorStop(0.5, "#facc15");
        goldGrad.addColorStop(1, "#f59e0b");

        ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
        ctx.shadowBlur = 24;
        ctx.fillStyle = goldGrad;
        ctx.font = "800 118px 'Noto Sans Devanagari', sans-serif";
        ctx.fillText(activeModel.headerTitle, W / 2, 230);
        ctx.shadowBlur = 0;

        var boxX = 68, boxY = H - 512, boxW = W - 136, boxH = 338;
        ctx.fillStyle = "rgba(15, 23, 42, 0.66)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.24)";
        ctx.lineWidth = 2;
        drawRoundRect(ctx, boxX, boxY, boxW, boxH, 32);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#fde68a";
        ctx.font = "700 27px 'Noto Sans Devanagari', sans-serif";
        ctx.fillText("📍 " + userSession.weatherText, W / 2, boxY + 54);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
        ctx.beginPath();
        ctx.moveTo(boxX + 64, boxY + 80);
        ctx.lineTo(boxX + boxW - 64, boxY + 80);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "700 39px 'Noto Sans Devanagari', sans-serif";
        wrapText(ctx, "“" + quoteText + "”", W / 2, boxY + 206, boxW - 68, 56);

        ctx.fillStyle = "#facc15";
        ctx.font = "800 42px 'Inter', sans-serif";
        ctx.fillText(activeModel.footerName, W / 2, H - 92);

        ctx.fillStyle = "#f1f5f9";
        ctx.font = "600 27px 'Inter', sans-serif";
        ctx.fillText(activeModel.footerRole, W / 2, H - 48);
      };

      if (currentBgDataUrl) {
        var img = new Image();
        img.onload = function () { ctx.drawImage(img, 0, 0, W, H); drawOverlays(); };
        img.onerror = function () { drawDefaultBackdrop(ctx, W, H); drawOverlays(); };
        img.src = currentBgDataUrl;
      } else {
        drawDefaultBackdrop(ctx, W, H);
        drawOverlays();
      }
    }

    function downloadPoster() {
      var canvas = document.getElementById("posterCanvas");
      var dateInfo = getTargetDate(dayOffset);
      var link = document.createElement("a");
      link.download = "MySrijan_" + dateInfo.isoKey + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      setNote("⬇️ HD पोस्टर सेव हो गया");
    }

    function shareWhatsApp() {
      var canvas = document.getElementById("posterCanvas");
      var dateInfo = getTargetDate(dayOffset);
      var customMsg = document.getElementById("captionInput").value.trim();

      if (navigator.canShare && navigator.share) {
        canvas.toBlob(function (blob) {
          var file = new File([blob], "MySrijan_" + dateInfo.isoKey + ".png", { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], text: customMsg }).catch(function () {});
            return;
          }
          fallbackShare(customMsg);
        }, "image/png");
        return;
      }
      fallbackShare(customMsg);
    }

    function fallbackShare(msg) {
      downloadPoster();
      setTimeout(function () {
        window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
      }, 400);
    }

    function setNote(txt) {
      document.getElementById("statusNote").textContent = txt;
    }
  </script>
</body>

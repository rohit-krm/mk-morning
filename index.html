<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ea580c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="सृजन" />
  <title>सृजन • AI Creative Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #faf7f2;
      --surface: #ffffff;
      --surface-soft: #f3ece1;
      --accent: #ea580c;
      --accent-soft: #fff7ed;
      --whatsapp: #16a34a;
      --text-main: #18181b;
      --text-sub: #71717a;
      --border: rgba(24, 24, 27, 0.08);
      --shadow-sm: 0 2px 10px rgba(24, 24, 27, 0.04);
      --shadow-lg: 0 24px 48px -14px rgba(24, 24, 27, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans Devanagari', 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: radial-gradient(circle at top center, #fff7ed 0%, var(--bg) 65%);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 12px) 14px env(safe-area-inset-bottom, 32px);
    }

    /* Login Screen */
    .login-screen {
      width: 100%;
      max-width: 400px;
      margin: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeUp 0.4s ease;
    }

    .login-logo {
      width: 68px; height: 68px; border-radius: 20px;
      background: linear-gradient(135deg, #fb923c, #ea580c);
      display: grid; place-items: center; color: #fff; font-size: 32px;
      box-shadow: 0 12px 24px rgba(234, 88, 12, 0.3);
    }

    .login-screen h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .login-screen p { font-size: 13.5px; color: var(--text-sub); line-height: 1.5; }

    .hidden { display: none !important; }

    /* Main App Shell */
    .app-shell {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top App Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
      position: relative;
    }

    .left-group { display: flex; align-items: center; gap: 10px; }

    .menu-btn {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center; cursor: pointer;
      box-shadow: var(--shadow-sm); color: var(--text-main);
    }
    .menu-btn:active { transform: scale(0.95); }

    .app-title h2 { font-size: 19px; font-weight: 800; line-height: 1.15; }
    .app-title span { font-size: 11.5px; font-weight: 600; color: var(--accent); display: block; }

    /* Profile Avatar & Dropdown */
    .profile-wrap { position: relative; }
    .avatar-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid #fb923c; padding: 0; overflow: hidden;
      background: #fff7ed; cursor: pointer; display: grid; place-items: center;
      font-weight: 800; color: var(--accent); font-size: 15px;
      box-shadow: var(--shadow-sm);
    }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

    .profile-menu {
      position: absolute; right: 0; top: 48px; width: 250px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 14px; box-shadow: var(--shadow-lg);
      z-index: 50; display: flex; flex-direction: column; gap: 10px;
      animation: fadeUp 0.18s ease;
    }

    .pm-user { border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .pm-name { font-size: 14px; font-weight: 800; color: var(--text-main); }
    .pm-email { font-size: 11.5px; color: var(--text-sub); word-break: break-all; font-family: 'Plus Jakarta Sans', sans-serif; }

    .credit-box {
      background: var(--accent-soft); border: 1px solid rgba(234, 88, 12, 0.18);
      border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .credit-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .credit-bar-bg { height: 6px; background: #fed7aa; border-radius: 99px; overflow: hidden; }
    .credit-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }

    .logout-btn {
      width: 100%; padding: 9px; border-radius: 11px; border: 1px solid #fecaca;
      background: #fef2f2; color: #b91c1c; font-size: 12.5px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }

    /* Sidebar Drawer */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(24, 24, 27, 0.45);
      backdrop-filter: blur(3px); z-index: 60;
    }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 82vw;
      background: var(--surface); z-index: 70; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 12px 0 36px rgba(0, 0, 0, 0.15);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar.closed { transform: translateX(-105%); }

    .sb-header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .sb-title { font-size: 17px; font-weight: 800; }
    .sb-close {
      border: none; background: var(--surface-soft); width: 32px; height: 32px;
      border-radius: 9px; font-size: 16px; cursor: pointer;
    }

    .model-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .model-item {
      text-align: left; padding: 12px 13px; border-radius: 14px;
      border: 1px solid var(--border); background: #fcfaf7;
      cursor: pointer; transition: all 0.18s ease; font-family: inherit;
    }
    .model-item.active {
      background: var(--accent-soft); border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.12);
    }
    .mi-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      color: var(--accent); background: #ffedd5; padding: 2px 7px; border-radius: 99px;
      margin-bottom: 4px; font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .mi-name { font-size: 14px; font-weight: 800; color: var(--text-main); display: block; }

    /* Status Pill */
    .status-strip {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 13px; font-size: 12px; font-weight: 700;
      box-shadow: var(--shadow-sm);
    }
    .credit-chip {
      background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0;
      padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 800;
    }

    /* Segmented Tabs */
    .segmented-control {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--surface-soft); padding: 4px; border-radius: 14px; border: 1px solid var(--border);
    }
    .seg-btn {
      border: none; background: transparent; padding: 8px 12px; border-radius: 10px;
      font-size: 13px; font-weight: 700; color: var(--text-sub); cursor: pointer; font-family: inherit;
    }
    .seg-btn.active { background: var(--surface); color: var(--text-main); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06); }

    /* Poster Canvas Card */
    .poster-frame {
      position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 24px;
      overflow: hidden; background: #18181b; box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    canvas { width: 100%; height: 100%; display: block; }

    .loader {
      position: absolute; inset: 0; background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(8px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; text-align: center; padding: 24px; z-index: 10;
    }
    .ring {
      width: 42px; height: 42px; border: 3.5px solid rgba(255, 255, 255, 0.18);
      border-top-color: #fb923c; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Generate New AI Image Button */
    .gen-ai-btn {
      width: 100%; height: 46px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #fb923c, #ea580c);
      color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 8px 18px -4px rgba(234, 88, 12, 0.35);
      transition: transform 0.15s ease;
    }
    .gen-ai-btn:active { transform: scale(0.98); }

    /* Clean Auto-Expanding Message Box (No Scrollbar) */
    .msg-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 13px 14px; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 6px;
    }
    .msg-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11.5px; font-weight: 700; color: var(--text-sub);
    }
    .msg-saved { color: #16a34a; opacity: 0; transition: opacity 0.25s; }
    .msg-saved.show { opacity: 1; }

    .clean-textarea {
      width: 100%; border: none; background: transparent;
      font-size: 14px; font-weight: 600; line-height: 1.5;
      color: var(--text-main); font-family: inherit;
      resize: none; overflow: hidden; outline: none; min-height: 44px;
    }

    /* Modern Bottom Action Dock */
    .bottom-actions {
      display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px;
    }
    .btn-modern {
      height: 52px; border-radius: 16px; font-size: 15px; font-weight: 800;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-family: inherit; transition: transform 0.15s ease;
    }
    .btn-modern:active { transform: scale(0.97); }
    .btn-dl {
      background: var(--surface); color: var(--text-main);
      border: 1px solid rgba(24, 24, 27, 0.14); box-shadow: var(--shadow-sm);
    }
    .btn-wa {
      background: linear-gradient(135deg, #22c55e, var(--whatsapp));
      color: #fff; border: none; box-shadow: 0 10px 22px -6px rgba(22, 163, 74, 0.45);
    }

    .toast-bar {
      text-align: center; font-size: 12px; font-weight: 700; color: var(--text-sub);
      min-height: 18px;
    }
  </style>
</head>
<body>

  <!-- 1. Gmail Sign-In Screen -->
  <section class="login-screen" id="loginScreen">
    <div class="login-logo">✨</div>
    <h1 id="loginAppTitle">सृजन</h1>
    <p>अपने व्यक्तिगत AI पोस्टर स्टूडियो में प्रवेश करने के लिए अपने Gmail खाते से लॉगिन करें।</p>
    <div id="googleBtnContainer" style="margin-top: 6px;"></div>
    <div id="loginError" style="color: #b91c1c; font-size: 12px; font-weight: 700;"></div>
  </section>

  <!-- 2. Sidebar Drawer for User Models -->
  <div class="drawer-backdrop hidden" id="drawerBackdrop" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar closed" id="sidebarDrawer">
    <div class="sb-header">
      <span class="sb-title">🎨 आपके मॉडल्स</span>
      <button type="button" class="sb-close" onclick="toggleSidebar(false)">✕</button>
    </div>
    <div class="model-list" id="sidebarModelList"></div>
  </aside>

  <!-- 3. Main Authenticated Studio -->
  <main class="app-shell hidden" id="mainApp">
    <header class="topbar">
      <div class="left-group">
        <button type="button" class="menu-btn" onclick="toggleSidebar(true)" aria-label="Models Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="app-title">
          <h2 id="headerAppName">सृजन</h2>
          <span id="activeModelBadge">सुप्रभात जौनपुर</span>
        </div>
      </div>

      <!-- Right Corner Google Profile Icon + Dropdown -->
      <div class="profile-wrap">
        <button type="button" class="avatar-btn" id="avatarBtn" onclick="toggleProfileMenu()">U</button>
        <div class="profile-menu hidden" id="profileMenu">
          <div class="pm-user">
            <div class="pm-name" id="pmName">User</div>
            <div class="pm-email" id="pmEmail">user@gmail.com</div>
          </div>
          <div class="credit-box">
            <div class="credit-row">
              <span>दैनिक क्रेडिट</span>
              <span id="pmCreditText">3 / 3 शेष</span>
            </div>
            <div class="credit-bar-bg">
              <div class="credit-bar-fill" id="pmCreditFill" style="width: 100%;"></div>
            </div>
          </div>
          <button type="button" class="logout-btn" onclick="handleLogout()">लॉग आउट (Log out)</button>
        </div>
      </div>
    </header>

    <div class="status-strip">
      <span id="weatherLabel">📍 जौनपुर: 25°C</span>
      <span class="credit-chip" id="topCreditChip">⚡ 3 क्रेडिट शेष</span>
    </div>

    <nav class="segmented-control">
      <button type="button" class="seg-btn active" id="tabToday" onclick="switchDay(0)">आज का पोस्टर</button>
      <button type="button" class="seg-btn" id="tabTomorrow" onclick="switchDay(1)">कल का पोस्टर</button>
    </nav>

    <section class="poster-frame">
      <canvas id="posterCanvas" width="1080" height="1350"></canvas>
      <div class="loader hidden" id="loader">
        <div class="ring"></div>
        <div style="font-size: 16px; font-weight: 800;">नई AI इमेज बन रही है...</div>
        <div style="font-size: 12.5px; color: #d4d4d8; margin-top: 4px;">यह अगले 24 घंटे तक सुरक्षित रहेगी</div>
      </div>
    </section>

    <button type="button" class="gen-ai-btn" onclick="generateNewAIImage()">
      <span>✨ नई AI इमेज जनरेट करें (1 क्रेडिट)</span>
    </button>

    <!-- Clean Auto-Growing Message Card (No Scrollbar) -->
    <section class="msg-card">
      <div class="msg-header">
        <span>✍️ साथ भेजने वाला संदेश</span>
        <span class="msg-saved" id="msgSavedBadge">✓ सेव</span>
      </div>
      <textarea
        id="messageTextarea"
        class="clean-textarea"
        rows="2"
        placeholder="यहाँ अपना संदेश लिखें..."
        oninput="autoGrowAndSaveMessage(this)"
      ></textarea>
    </section>

    <div class="bottom-actions">
      <button type="button" class="btn-modern btn-dl" onclick="downloadPoster()">⬇️ Save HD</button>
      <button type="button" class="btn-modern btn-wa" onclick="shareWhatsApp()">📲 WhatsApp पर भेजें</button>
    </div>

    <div class="toast-bar" id="toastBar"></div>
  </main>

  <script>
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbx6zoZnGG48_mdAcC-AEw3RFaEZYApaXxwChFd6t1_vYJbSYLFvrh5MbTZliPvRF_5Y/exec";

    var idToken = localStorage.getItem("srijan_id_token") || "";
    var userSession = null;
    var activeModel = null;
    var dayOffset = 0;
    var currentBgDataUrl = null;
    var msgTimer = null;

    var DAYS_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var MONTHS_EN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    // 1. Dynamic PWA Manifest ("सृजन")
    (function registerManifest() {
      var manifest = {
        name: "सृजन - AI Creative Studio",
        short_name: "सृजन",
        start_url: ".",
        display: "standalone",
        background_color: "#faf7f2",
        theme_color: "#ea580c",
        icons: [{
          src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ea580c'/><text x='50' y='66' font-size='52' text-anchor='middle'>✨</text></svg>",
          sizes: "512x512",
          type: "image/svg+xml"
        }]
      };
      var link = document.createElement("link");
      link.rel = "manifest";
      link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    })();

    // 2. IndexedDB Helper for 24-Hour Image Persistence
    function openImageDB() {
      return new Promise(function (resolve, reject) {
        var req = indexedDB.open("SrijanPosterDB", 1);
        req.onupgradeneeded = function (e) {
          e.target.result.createObjectStore("posters", { keyPath: "key" });
        };
        req.onsuccess = function (e) { resolve(e.target.result); };
        req.onerror = function (e) { reject(e); };
      });
    }

    async function savePersistedPoster(key, dataUrl) {
      try {
        var db = await openImageDB();
        var tx = db.transaction("posters", "readwrite");
        tx.objectStore("posters").put({ key: key, dataUrl: dataUrl, savedAt: Date.now() });
      } catch (e) {}
    }

    async function loadPersistedPoster(key) {
      try {
        var db = await openImageDB();
        return await new Promise(function (resolve) {
          var tx = db.transaction("posters", "readonly");
          var req = tx.objectStore("posters").get(key);
          req.onsuccess = function () {
            var item = req.result;
            // Valid for 24 hours (86400000 ms)
            if (item && (Date.now() - item.savedAt) < 86400000) {
              resolve(item.dataUrl);
            } else {
              resolve(null);
            }
          };
          req.onerror = function () { resolve(null); };
        });
      } catch (e) {
        return null;
      }
    }

    // 3. Google Sign-In Initialization
    window.onload = async function () {
      try {
        var cfgRes = await fetch(GAS_API_URL + "?action=public_config");
        var cfg = await cfgRes.json();
        if (cfg.appName) {
          document.getElementById("loginAppTitle").textContent = cfg.appName;
          document.getElementById("headerAppName").textContent = cfg.appName;
        }
        if (cfg.googleClientId && cfg.googleClientId !== "PASTE_YOUR_GOOGLE_OAUTH_CLIENT_ID_HERE" && window.google) {
          google.accounts.id.initialize({
            client_id: cfg.googleClientId,
            callback: onGoogleSignIn
          });
          google.accounts.id.renderButton(document.getElementById("googleBtnContainer"), {
            theme: "outline",
            size: "large",
            shape: "pill",
            text: "signin_with"
          });
        } else {
          document.getElementById("loginError").textContent = "कृपया Google Sheet की Config टैब में GOOGLE_CLIENT_ID सेट करें।";
        }
      } catch (e) {
        document.getElementById("loginError").textContent = "सर्वर से जुड़ने में समस्या आ रही है।";
      }

      if (idToken) {
        authenticateWithBackend(idToken);
      }
    };

    function onGoogleSignIn(response) {
      idToken = response.credential;
      localStorage.setItem("srijan_id_token", idToken);
      authenticateWithBackend(idToken);
    }

    async function authenticateWithBackend(token) {
      document.getElementById("loginError").textContent = "खाता सत्यापित हो रहा है...";
      try {
        var res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "login", idToken: token })
        });
        var data = await res.json();
        if (!data.ok) {
          localStorage.removeItem("srijan_id_token");
          document.getElementById("loginError").textContent = data.error || "लॉगिन विफल रहा";
          return;
        }

        userSession = data;
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("mainApp").classList.remove("hidden");

        setupUserUI();
        renderSidebarModels();
        selectModel(data.models[0]);
      } catch (err) {
        document.getElementById("loginError").textContent = "कनेक्शन त्रुटि: " + err.message;
      }
    }

    function setupUserUI() {
      var u = userSession.user;
      document.getElementById("weatherLabel").textContent = "📍 " + userSession.weatherText;
      document.getElementById("pmName").textContent = u.name;
      document.getElementById("pmEmail").textContent = u.email;

      var avatarBtn = document.getElementById("avatarBtn");
      if (u.picture) {
        avatarBtn.innerHTML = '<img src="' + u.picture + '" alt="Profile" />';
      } else {
        avatarBtn.textContent = u.name.charAt(0).toUpperCase();
      }
      updateCreditDisplay(u.remainingCredits, u.dailyLimit);
    }

    function updateCreditDisplay(remaining, limit) {
      document.getElementById("topCreditChip").textContent = "⚡ " + remaining + " क्रेडिट शेष";
      document.getElementById("pmCreditText").textContent = remaining + " / " + limit + " शेष";
      var pct = Math.min(100, Math.round((remaining / Math.max(1, limit)) * 100));
      document.getElementById("pmCreditFill").style.width = pct + "%";
    }

    function toggleProfileMenu() {
      document.getElementById("profileMenu").classList.toggle("hidden");
    }

    function toggleSidebar(open) {
      var drawer = document.getElementById("sidebarDrawer");
      var backdrop = document.getElementById("drawerBackdrop");
      if (open) {
        drawer.classList.remove("closed");
        backdrop.classList.remove("hidden");
      } else {
        drawer.classList.add("closed");
        backdrop.classList.add("hidden");
      }
    }

    function handleLogout() {
      localStorage.removeItem("srijan_id_token");
      location.reload();
    }

    function renderSidebarModels() {
      var listEl = document.getElementById("sidebarModelList");
      listEl.innerHTML = "";
      userSession.models.forEach(function (m) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "model-item" + (activeModel && activeModel.id === m.id ? " active" : "");
        btn.innerHTML = '<span class="mi-badge">' + m.badge + '</span><span class="mi-name">' + m.name + '</span>';
        btn.onclick = function () {
          selectModel(m);
          toggleSidebar(false);
        };
        listEl.appendChild(btn);
      });
    }

    async function selectModel(model) {
      activeModel = model;
      document.getElementById("activeModelBadge").textContent = model.name;
      renderSidebarModels();

      // Load saved message for this model or default message
      var msgKey = "srijan_msg_" + userSession.user.email + "_" + model.id;
      var savedMsg = localStorage.getItem(msgKey);
      var ta = document.getElementById("messageTextarea");
      ta.value = savedMsg !== null ? savedMsg : model.defaultMessage;
      autoGrowTextarea(ta);

      // Load 24-hour persisted AI image for this user + model
      var posterKey = "srijan_img_" + userSession.user.email + "_" + model.id;
      currentBgDataUrl = await loadPersistedPoster(posterKey);
      renderPosterCanvas();
      setToast(currentBgDataUrl ? "24-घंटे की सेव इमेज लोड हुई" : "डिफ़ॉल्ट दृश्य तैयार — नई इमेज के लिए नीचे बटन दबाएं");
    }

    function autoGrowTextarea(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    function autoGrowAndSaveMessage(el) {
      autoGrowTextarea(el);
      if (userSession && activeModel) {
        var msgKey = "srijan_msg_" + userSession.user.email + "_" + activeModel.id;
        localStorage.setItem(msgKey, el.value);
      }
      var badge = document.getElementById("msgSavedBadge");
      badge.classList.add("show");
      clearTimeout(msgTimer);
      msgTimer = setTimeout(function () { badge.classList.remove("show"); }, 1400);
    }

    function switchDay(offset) {
      dayOffset = offset;
      document.getElementById("tabToday").classList.toggle("active", offset === 0);
      document.getElementById("tabTomorrow").classList.toggle("active", offset === 1);
      renderPosterCanvas();
    }

    function getTargetDateObj(offset) {
      var d = new Date();
      d.setDate(d.getDate() + offset);
      var dd = String(d.getDate()).padStart(2, "0");
      var mm = String(d.getMonth() + 1).padStart(2, "0");
      var yyyy = d.getFullYear();
      return {
        isoKey: yyyy + "-" + mm + "-" + dd,
        formattedDate: d.getDate() + " " + MONTHS_EN[d.getMonth()] + " " + yyyy,
        dayName: DAYS_EN[d.getDay()]
      };
    }

    async function generateNewAIImage() {
      if (!userSession || !activeModel) return;
      if (userSession.user.remainingCredits <= 0) {
        setToast("⚠️ आज के सभी क्रेडिट समाप्त हो गए हैं। कल पुनः प्रयास करें।");
        return;
      }

      var dateInfo = getTargetDateObj(dayOffset);
      var quoteText = document.getElementById("messageTextarea").value.trim() || activeModel.defaultMessage;
      var loader = document.getElementById("loader");
      loader.classList.remove("hidden");

      try {
        var res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "generate",
            idToken: idToken,
            basePrompt: activeModel.prompt,
            modelName: activeModel.name,
            dateStr: dateInfo.formattedDate,
            dayStr: dateInfo.dayName,
            quote: quoteText
          })
        });
        var data = await res.json();
        loader.classList.add("hidden");

        if (!data.ok) {
          setToast("⚠️ " + (data.error || "इमेज जनरेट नहीं हो सकी"));
          return;
        }

        currentBgDataUrl = data.dataUrl;
        userSession.user.remainingCredits = data.remainingCredits;
        updateCreditDisplay(data.remainingCredits, data.dailyLimit);

        // Persist for 24 hours
        var posterKey = "srijan_img_" + userSession.user.email + "_" + activeModel.id;
        await savePersistedPoster(posterKey, currentBgDataUrl);

        renderPosterCanvas();
        setToast("✨ नई AI इमेज तैयार और अगले 24 घंटे के लिए सेव हो गई!");
      } catch (err) {
        loader.classList.add("hidden");
        setToast("⚠️ नेटवर्क त्रुटि: " + err.message);
      }
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawDefaultSunrise(ctx, W, H) {
      var skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.65);
      skyGrad.addColorStop(0, "#1e1b4b");
      skyGrad.addColorStop(0.4, "#9a3412");
      skyGrad.addColorStop(0.75, "#f59e0b");
      skyGrad.addColorStop(1, "#fef08a");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      var halo = ctx.createRadialGradient(W * 0.5, H * 0.44, 20, W * 0.5, H * 0.44, 340);
      halo.addColorStop(0, "rgba(255, 251, 235, 0.95)");
      halo.addColorStop(1, "rgba(251, 146, 60, 0)");
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, W, H);

      var fieldGrad = ctx.createLinearGradient(0, H * 0.52, 0, H);
      fieldGrad.addColorStop(0, "#3f6212");
      fieldGrad.addColorStop(1, "#052e16");
      ctx.fillStyle = fieldGrad;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.55);
      ctx.quadraticCurveTo(W * 0.5, H * 0.49, W, H * 0.56);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.fill();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      var words = String(text).split(" ");
      var line = "";
      var lines = [];
      for (var n = 0; n < words.length; n++) {
        var testLine = line + words[n] + " ";
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line.trim());
          line = words[n] + " ";
        } else {
          line = testLine;
        }
      }
      lines.push(line.trim());
      var startY = y - ((lines.length - 1) * lineHeight) / 2;
      for (var i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, startY + i * lineHeight);
      }
    }

    function renderPosterCanvas() {
      if (!activeModel || !userSession) return;
      var canvas = document.getElementById("posterCanvas");
      var ctx = canvas.getContext("2d");
      var W = canvas.width;
      var H = canvas.height;
      var dateInfo = getTargetDateObj(dayOffset);
      var quoteText = document.getElementById("messageTextarea").value.trim() || activeModel.defaultMessage;

      var drawOverlays = function () {
        var topGrad = ctx.createLinearGradient(0, 0, 0, 320);
        topGrad.addColorStop(0, "rgba(15, 23, 42, 0.68)");
        topGrad.addColorStop(1, "rgba(15, 23, 42, 0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, W, 320);

        var botGrad = ctx.createLinearGradient(0, H - 560, 0, H);
        botGrad.addColorStop(0, "rgba(15, 23, 42, 0)");
        botGrad.addColorStop(1, "rgba(15, 23, 42, 0.92)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, H - 560, W, 560);

        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(15, 23, 42, 0.48)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
        ctx.lineWidth = 2;
        drawRoundRect(ctx, W / 2 - 275, 46, 550, 56, 28);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "600 29px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText(dateInfo.formattedDate + "  •  " + dateInfo.dayName, W / 2, 84);

        var goldGrad = ctx.createLinearGradient(0, 130, 0, 245);
        goldGrad.addColorStop(0, "#fef08a");
        goldGrad.addColorStop(0.5, "#facc15");
        goldGrad.addColorStop(1, "#f59e0b");

        ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
        ctx.shadowBlur = 24;
        ctx.fillStyle = goldGrad;
        ctx.font = "800 120px 'Noto Sans Devanagari', sans-serif";
        ctx.fillText(activeModel.headerTitle, W / 2, 230);
        ctx.shadowBlur = 0;

        var boxX = 68, boxY = H - 512, boxW = W - 136, boxH = 338;
        ctx.fillStyle = "rgba(15, 23, 42, 0.66)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.24)";
        ctx.lineWidth = 2;
        drawRoundRect(ctx, boxX, boxY, boxW, boxH, 32);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#fde68a";
        ctx.font = "700 28px 'Noto Sans Devanagari', sans-serif";
        ctx.fillText("📍 " + userSession.weatherText, W / 2, boxY + 54);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
        ctx.beginPath();
        ctx.moveTo(boxX + 64, boxY + 80);
        ctx.lineTo(boxX + boxW - 64, boxY + 80);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "700 39px 'Noto Sans Devanagari', sans-serif";
        wrapText(ctx, "“" + quoteText + "”", W / 2, boxY + 206, boxW - 68, 56);

        ctx.fillStyle = "#facc15";
        ctx.font = "800 42px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText(activeModel.footerName, W / 2, H - 92);

        ctx.fillStyle = "#f4f4f5";
        ctx.font = "600 27px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText(activeModel.footerRole, W / 2, H - 48);
      };

      if (currentBgDataUrl) {
        var img = new Image();
        img.onload = function () { ctx.drawImage(img, 0, 0, W, H); drawOverlays(); };
        img.onerror = function () { drawDefaultSunrise(ctx, W, H); drawOverlays(); };
        img.src = currentBgDataUrl;
      } else {
        drawDefaultSunrise(ctx, W, H);
        drawOverlays();
      }
    }

    function downloadPoster() {
      var canvas = document.getElementById("posterCanvas");
      var dateInfo = getTargetDateObj(dayOffset);
      var link = document.createElement("a");
      link.download = "Srijan_" + dateInfo.isoKey + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      setToast("⬇️ HD पोस्टर सेव हो गया");
    }

    function shareWhatsApp() {
      var canvas = document.getElementById("posterCanvas");
      var dateInfo = getTargetDateObj(dayOffset);
      var customMsg = document.getElementById("messageTextarea").value.trim();

      if (navigator.canShare && navigator.share) {
        canvas.toBlob(function (blob) {
          var file = new File([blob], "Srijan_" + dateInfo.isoKey + ".png", { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], text: customMsg }).catch(function () {});
            return;
          }
          fallbackShare(customMsg);
        }, "image/png");
        return;
      }
      fallbackShare(customMsg);
    }

    function fallbackShare(msg) {
      downloadPoster();
      setTimeout(function () {
        window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
      }, 400);
    }

    function setToast(txt) {
      document.getElementById("toastBar").textContent = txt;
    }
  </script>
</body>
